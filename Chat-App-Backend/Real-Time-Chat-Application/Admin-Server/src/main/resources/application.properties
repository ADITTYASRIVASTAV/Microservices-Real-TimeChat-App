spring.application.name=admin-server
server.port=8090

# Spring Boot Admin UI
spring.boot.admin.ui.title=ChatApp Admin
spring.boot.admin.ui.brand=ChatApp Monitor

# Security
spring.security.user.name=admin
spring.security.user.password=admin123

# Eureka Client
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Logging
logging.level.de.codecentric.boot.admin=INFO
logging.level.com.chatapp.admin=DEBUG
